services:
  - type: web
    name: comparam
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Winner Poker (/winner): demo con datos ficticios («1» = práctica desde cero con 3 mesas;
      # «completo» = sala de 30 mesas con evento y satélite). En producción quitar WINNER_DEMO y definir
      # WINNER_SECRET, WINNER_SMS_WEBHOOK y una base de datos en disco persistente (WINNER_DB).
      - key: WINNER_DEMO
        value: "1"
