# Revisión diaria de anuncios: guarda el historial y detecta los nuevos de las zonas configuradas
# en data/diario_config.json. Después actualiza la app en Render para que /nuevos los muestre.
name: Anuncios diarios

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a.m. hora de Bogotá (UTC-5)
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Instalar el navegador (Metrocuadrado, Habi y Houm)
        run: python -m playwright install --with-deps --only-shell chromium
        continue-on-error: true   # si falla, la revisión sigue con los demás portales
      - name: Revisar los portales
        timeout-minutes: 45
        continue-on-error: true   # aunque se corte, se guarda lo avanzado (el historial se escribe por barrio)
        env:
          COMPARAM_NAVEGADOR: "1"
          COMPARAM_PAGINAS_NAVEGADOR: "2"
        run: python -m comparam.diario
      - name: Guardar el historial en el repositorio
        if: always()
        run: |
          git config user.name "comparam-diario"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historial data/diario
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Anuncios del $(TZ=America/Bogota date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Actualizar la app en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Falta RENDER_DEPLOY_HOOK"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render actualizado"
