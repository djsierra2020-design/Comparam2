<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compara m² · Lista vencida</title><meta name="robots" content="noindex">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font:16px/1.5 "Segoe UI",system-ui,Roboto,sans-serif;
    color:#fff; background:linear-gradient(160deg,#0d7466,#06423a); text-align:center; padding:24px }
  img { width:90px; height:90px; border-radius:22px }
  h1 { font-size:26px; margin:16px 0 8px }
  a { display:inline-block; margin-top:22px; padding:14px 22px; border-radius:14px; background:#25d366; color:#fff; font-weight:800; text-decoration:none }
</style></head>
<body><div>
  <img src="/static/icon-192.png" alt="">
  {% if vence %}
  <h1>Esta lista venció el {{ vence }}</h1>
  <p>Los apartamentos cambian todos los días. Escríbenos y te mandamos una lista nueva.</p>
  {% else %}
  <h1>Este link no es válido</h1>
  <p>Puede que esté incompleto. Escríbenos y te lo enviamos de nuevo.</p>
  {% endif %}
  <a href="https://wa.me/573163988646?text={{ 'Hola, quiero una lista nueva de apartamentos'|urlencode }}">💬 Escribir por WhatsApp</a>
</div></body></html>
